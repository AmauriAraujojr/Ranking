<!DOCTYPE html>

<head>

    <style>
        * {
            padding: 0;
            margin: 0;
            font-family: "Montserrat", sans-serif;

        }

        body {
            background-color: #000000;
         display: flex;
         height: 100vh;

        }

        main {
            display: flex;

            align-items: center;
            width: 100%;
            padding: 20px 0;
            max-width: 1062px;
            position: relative;
            margin: 0 auto;
            gap:20px;

        }

        .title {
            font-family: Bree, sans-serif;
            text-transform: uppercase;
            font-weight: 700;
            color: #EDEDED;
            font-size: 1.25rem;
            text-align: center;
            align-self: center;

        }

        .ranking {
            width: 90%;
            display: flex;
            flex-direction: column;
            gap: 10px;
        max-width: 730px;
        }

        .players {
            width: 100%;
            max-width: 100%;
border-radius: 15px;
            height: 42px;
            border: 1px solid #063BBB;
            display: flex;
            align-items: center;
            position: relative;
            justify-content: space-between;
            gap: 30px;
            color: #EDEDED;
            background: radial-gradient(#17347A 2%, #000000 75%);
        }

        .img_box {
            width: 51px;
            height: 100%;
            background-color: #17347A;
            display: flex;
            align-items:center ;
            justify-content: center;
            font-size: 20px;
            font-weight: 800;
            color:#D4D4D4;
            border-radius: 15px ;
            padding: 5px;

        }

        .value {

            width: 70px;
        }

        .center_ligth {
            position: absolute;
            top: 0;
            left: 31%;
            width: 178px;


        }

        .box {
            display: flex;
            align-items: center;
            gap: 40px;
        }

        .btn_back {
            height: 100%;
            border-radius:12px;
        }

.input_box {
            width: 90%;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 730px;
            align-items: center;
        }

        input {
            padding: 10px 5px;
            width: 260px;
            border-radius: 12px 0 0 12px;
            border: 1px solid #D4D4D4;
            background-color: #00004A;
            color: #D4D4D4;
            max-width: 100%;
        }

        input::placeholder {
            color: #D4D4D4;
        }

        input:focus {
            outline: none;

        }

        input:focus::-webkit-input-placeholder {
            color: transparent;
        }

        button {
            background-color: #D4D4D4;
            padding: 10px;
            border-radius: 0 12px 12px 0;
            display: flex;
            align-items: center;
            border: 1px solid#D4D4D4;
            color:#00004A;
            cursor: pointer;
        }

        .submit_box {
            display: flex;
            max-width: 100%;
        }


        .left_ligth {
            position: absolute;
            top: 0;
            left: -40px;
            width: 120px;
            opacity: 60%;


        }

        .right_ligth {
            position: absolute;
            top: 0;
            right: -40px;
            width: 120px;
            opacity: 60%;



        }

        .logo {
            position: absolute;
            width: 101px;
            top:-30px;
        }

        footer {
            background-color: #001E68;
            border-radius: 0 0 20px 20px ;
            width: 100%;
            height: 115px;
            display: flex;
            align-items:center;
            justify-content: center;
            box-sizing: content-box;
            gap: 10px;
color: #EDEDED;
        }

        footer h4 {
            text-align: center;
            font-weight: 700;
            font-size: 1.3rem;

        }

        footer h3 {
            font-weight: 500;
            font-size: 12px;
            font-style: italic;
            text-align: center;
        }

        .load{
            color:white;
            align-self: center;
            font-size: 30px;
        }
        
        .title_box{
            background-color: #001E68;
            border-radius: 20px 20px 0 0;
            width: 100%;
            height: 115px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: content-box;
            flex-direction: column;
            position: relative;
        }
        @media(min-width:957px) {
          

            .title_box{
                flex-direction: row;
                align-items: start;

            }
            .logo{
                position:unset ;
                width: 157px;
                display: flex;
                align-items: center;
                justify-content: center;
            }

        }
        .taca{
            
            max-width: 141.61px;
        }
        @media(min-width:725px){
            .taca{
position: absolute;   
left: 0;         }

footer h4{

    font-size: 1.75rem;
}
footer h3{
    font-size: 1rem;
}
        }
        .content{
            display: flex;
            flex-direction: column;
            gap:10px;
        }

        @media(min-width:1050px){
            .taca{
                max-width: 359.46px;
                left:-115px;
                bottom: 0px;
            }
        }

        .notFound_container{
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }
    </style>
</head>

<body>

    <main>
        <!-- <img class="center_ligth" src="https://res.cloudinary.com/dcyrneauz/image/upload/v1721845331/Luz_1_a3qn79.png"
            alt="" srcset=""> -->

            
            <div class="title_box">
                <img class="logo"
                    src="https://res.cloudinary.com/dp49xwcbe/image/upload/v1724348758/Football_Studio_2_qqhihh.png" alt=""
                    srcset="">

                <h1 class="title">Ranking Oficial Sniper: Veja os Líderes do Torneio na Jornada a R$5.000!</h1>
            </div>
            <form class="input_box">
                <p>Descubra sua posição do RANKING</p>
                <div class="submit_box">
    
                    <input type="email" placeholder="Digite seu email da sortenabet aqui">
                    <button type="button">Pesquisar</button>
                </div>
            </form>
    
        <div class="ranking">


        </div>

        <footer>
            <img  class="taca"src="https://res.cloudinary.com/dp49xwcbe/image/upload/v1724348515/GOL_DE_OURO_1_vfmzoc.png" alt="" srcset="">
           <div class="content">

               <h4>O torneio vai até 25/08.
               </h4>
               <h3>Continue jogando e mantenha-se no topo para garantir sua vitória!</h3>
           </div>
        </footer>

    </main>

    <script>
        const baseUrl = 'https://n8n.sortenabetferramentas.online/webhook/8c1be377-8df3-404c-8171-maria'

        const requestHeaders = {
            'Content-Type': 'application/json',

        }
        const getRankings = async () => {
            const rankings = await fetch(`${baseUrl}`, {
                method: 'GET',
                headers: requestHeaders,

            })
                .then(response => {
                    if (response.ok) {
                        return response.json()
                    } else {
                        response.json().then(respError => {
                            alert(`${respError.message}`)
                        })
                    }
                })
            return rankings

        }

        const createRanking = (ranking, position,first) => {
            const players = document.createElement("div")
            const imgContainer = document.createElement("div")
            const playerImg = document.createElement("img")
            const playerName = document.createElement("h4")
            const playerValue = document.createElement("h4")
            const playerBox = document.createElement('div')

            players.classList.add("players")
            imgContainer.classList.add("img_box")
            playerName.classList.add("name")
            playerValue.classList.add("value")
            playerBox.classList.add('box')

            const not_btn = document.createElement('button')
    not_btn.innerText = 'Voltar'
    not_btn.classList.add("btn_back")

    if (ranking.message) {
        const not_box = document.createElement('div')
        const not_msg = document.createElement('h3')

        not_msg.innerText = ranking.message

        not_box.classList.add("notFound_container")

        not_box.append(not_msg, not_btn)

        players.append(not_box)


        return players
    }


            if (position == 1 && first) {
                playerImg.src = "https://res.cloudinary.com/dp49xwcbe/image/upload/v1724348776/Ouro_jj39mp.png"
                imgContainer.appendChild(playerImg)
            }
            else if (position == 2 && first) {
                playerImg.src = "https://res.cloudinary.com/dp49xwcbe/image/upload/v1724348789/Prata_srsulb.png"
                imgContainer.appendChild(playerImg)
            }
            else if (position == 3 && first) {
                playerImg.src = "https://res.cloudinary.com/dp49xwcbe/image/upload/v1724348805/Bronze_ihmjjd.png"
                imgContainer.appendChild(playerImg)
            }
         
            else (
                imgContainer.innerText = `${position}º`
            )
            playerName.innerText = ranking.nome
            playerValue.innerText = `R$ ${ranking.total_deposit}`

            playerBox.append(imgContainer, playerName)
    players.append(playerBox, playerValue)

    if (!first) {
        players.append(not_btn)
    }
            return players
        }

        const renderPlayer = async (first, array = []) => {
    const ranking = document.querySelector(".ranking")

    ranking.innerHTML = " <h4 class='load'>Carregando...</h4>"

    const rankings = await getRankings()

    ranking.innerHTML = ""

    if (first) {
        rankings.forEach((e, index) => {
            const position = e.position
            if (e.position <= 10) {
                const player = createRanking(e, position, first)
                ranking.appendChild(player)
            }

        });
    }

    else {

        array.forEach((e, index) => {
            const position = e.position
            const player = createRanking(e, position, false)
            ranking.appendChild(player)


        });
        array.shift()
    }
    renderBtn()
}



         renderPlayer(true)

         const filterRanking = () => {
    const userEmail = document.querySelector("input")
    const btnSubmit = document.querySelector('button')
    array = []


    btnSubmit.addEventListener("click", async () => {
        const rankings = await fetch(`https://n8n.sortenabetferramentas.online/webhook/15af85e6-1781-get-user?email=${userEmail.value}`, {
            method: 'GET',
            headers: requestHeaders,

        })
            .then(response => {
                if (response.ok) {
                    return response.json()
                } else {
                    response.json().then(respError => {
                        alert(`${respError.message}`)
                    })
                }
            })


        if (array.length < 1) {
            array.push(rankings)
        }


        renderPlayer(false, array)

    })
}

filterRanking()


         const renderBtn = () => {
    const btn = document.querySelector(".btn_back")
    if (btn) {
        btn.addEventListener('click', () => {
            renderPlayer(true)
        })
    }
}
    </script>

</body>

</html>
