<!DOCTYPE html>

<head>

    <style>
        * {
            padding: 0;
            margin: 0;
            font-family: "Montserrat", sans-serif;

        }

        body {
            background-color: #000000;
            display: flex;
            height: 100vh;

            color: #D4D4D4;
        }

        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            padding: 20px 0;
            max-width: 1062px;

            margin: 0 auto;
            gap: 20px;

        }

        .title {
            font-family: Bree, sans-serif;
            text-transform: uppercase;
            font-weight: 700;
            color: #FFD230;
            font-size: 1.45rem;
            text-align: center;
            align-self: center;
            font-style: italic;

        }
        .input_box{
            width: 90%;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 730px;
            align-items: center;
        }
        input{
            padding: 10px 5px;
            width: 260px;
            border-radius: 12px 0 0 12px;
            border: 1px solid #E50539;

            color: #D4D4D4;
            max-width: 100%;
        }
        input::placeholder{
      color:#D4D4D4;
    }
        input:focus{
            outline: none;
            
        }
        input:focus::-webkit-input-placeholder{
            color: transparent;
        }

        button{
            background-color:#E50539;
padding: 10px;
border-radius:0 12px 12px 0;
display: flex;
align-items: center;
border: 1px solid #E50539;
color: #EDEDED;
        }
.submit_box{
    display: flex;
    max-width: 100%;
}
        .ranking {
            width: 90%;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 730px;
        }

        .players {
            width: 100%;
            max-width: 100%;
            border-radius: 50px;
            height: 47px;
            display: flex;
            align-items: center;
            position: relative;
            gap: 30px;
            color: #EDEDED;
            background: #0C0C0C;

        }

        .img_box {
            width: 45px;
            height: 45px;
            background-color:#E50539;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 800;
            color: #D4D4D4;
            border-radius: 50px ;
            margin: 3px;
        }

        .value {
            position: absolute;
            right:0;
            background-color:#E50539;
width: 25%;
height: 40px;
border-radius: 50px;
display: flex;
align-items: center;
padding: 5px;

        }
@media(min-width:540px){
    .value{
justify-content: center;

    }
}
        .center_ligth {
            position: absolute;
            top: 0;
            left: 31%;
            width: 178px;


        }

        .left_ligth {
            position: absolute;
            top: 0;
            left: -40px;
            width: 120px;
            opacity: 60%;


        }

        .right_ligth {
            position: absolute;
            top: 0;
            right: -40px;
            width: 120px;
            opacity: 60%;



        }

        .logo {
            position: absolute;
            width: 101px;
            top: -30px;
        }

        footer {
            border-radius: 0 0 20px 20px;
            width: 100%;
            height: 115px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: content-box;
            gap: 10px;
            color: #EDEDED;
            position: relative;
        }

        footer h4 {
            text-align: center;
            font-weight: 700;
            font-size: 1.3rem;

        }

        footer h3 {
            font-weight: 600;
            font-size: 1rem;
            text-align: center;
        }

        .date {
            color: #FFD230;
        }

        .load {
            color: white;
            align-self: center;
            font-size: 30px;
        }

        .title_box {
            background-color: #001E68;
            border-radius: 20px 20px 0 0;
            width: 100%;
            height: 115px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: content-box;
            flex-direction: column;
            position: relative;
        }

        @media(min-width:957px) {


            .title_box {
                flex-direction: row;
                align-items: start;

            }

            .logo {
                position: unset;
                width: 157px;
                display: flex;
                align-items: center;
                justify-content: center;
            }

        }

        .taca {

            max-width: 183px;
            position: absolute;
            left: -40px;
            bottom: -45px;
        }
        @media(min-width:950px){
            .taca{
                max-width:285px ;
                left: -100px;
                bottom: 0;
            }
        }
    </style>
</head>

<body>
    <!-- <img class="left_ligth" src="https://res.cloudinary.com/dcyrneauz/image/upload/v1721845331/Luz_1_a3qn79.png" alt=""
        srcset="">

    <main>
        <!-- <img class="center_ligth" src="https://res.cloudinary.com/dcyrneauz/image/upload/v1721845331/Luz_1_a3qn79.png"
            alt="" srcset=""> -->


        <h3>Ranking Oficial do Torneio</h3>
        <h1 class="title">"Rumo ao Céu com Aviator”</h1>
        <h3>Veja os Líderes na Jornada a R$5.000!</h3>
       <form class="input_box">
        <p>Descubra sua posição do RANKING</p>
        <div class="submit_box">

            <input type="email" placeholder="Digite seu email da sortenabet aqui">
          <button type="button">Pesquisar</button>
        </div>
    </form>
       
        <div class="ranking">


        </div>

        <footer>

            <h3><span class="date">O torneio vai até 25/08.</span> Continue jogando e mantenha-se no topo para garantir
                sua vitória!</h3>
                <img class="taca" src="https://res.cloudinary.com/dcyrneauz/image/upload/v1723814695/Avi%C3%A3o_xbkou3.png" alt="" srcset="">
        </footer>
    </main>

    <script>
        const baseUrl = 'https://n8n.sortenabetferramentas.online/webhook/8c1be377-8df3-404c-8171-maria'

        const requestHeaders = {
            'Content-Type': 'application/json',

        }
        const getRankings = async () => {
            const rankings = await fetch(`${baseUrl}`, {
                method: 'GET',
                headers: requestHeaders,

            })
                .then(response => {
                    if (response.ok) {
                        return response.json()
                    } else {
                        response.json().then(respError => {
                            alert(`${respError.message}`)
                        })
                    }
                })
            return rankings

        }

        const createRanking = (ranking, position,first) => {
            const players = document.createElement("div")
            const imgContainer = document.createElement("div")
            const playerImg = document.createElement("img")
            const playerName = document.createElement("h4")
            const playerValue = document.createElement("h4")

            players.classList.add("players")
            imgContainer.classList.add("img_box")
            playerName.classList.add("name")
            playerValue.classList.add("value")

            if (position == 1 && first) {
                playerImg.src = "https://res.cloudinary.com/dcyrneauz/image/upload/v1723814648/OURO_ltzpyf.png"
                imgContainer.appendChild(playerImg)
            }
            else if (position == 2 && first) {
                playerImg.src = "https://res.cloudinary.com/dcyrneauz/image/upload/v1723814660/PRATA_ndbmj3.png"
                imgContainer.appendChild(playerImg)
            }
            else if (position == 3 && first) {
                playerImg.src = "https://res.cloudinary.com/dcyrneauz/image/upload/v1723814678/BRONZE_jlbj0r.png"
                imgContainer.appendChild(playerImg)
            }

            else (
                imgContainer.innerText = `${position}º`
            )
            playerName.innerText = ranking.nome
            playerValue.innerText = `R$ ${ranking.total_deposit}`

            players.append(imgContainer, playerName, playerValue)

            return players
        }

        const renderPlayer = async (first,array=[]) => {
            const ranking = document.querySelector(".ranking")

            ranking.innerHTML = " <h4 class='load'>Carregando...</h4>"

            const rankings = await getRankings()


            ranking.innerHTML = ''
            if(first){

                rankings.forEach((e, index) => {
                    const position = e.position
                    if (e.position <= 10) {
                        const player = createRanking(e, position,first)
                        ranking.appendChild(player)
                    }
                    
                });
            }

            else{
                array.forEach((e, index) => {
                    const position = e.position
                        const player = createRanking(e, position,false)
                        ranking.appendChild(player)
                    
                    
                });
            }
        }

        renderPlayer(true)

        const filterRanking=()=>{
            const userEmail=document.querySelector("input")
       const btnSubmit=document.querySelector('button')
       array=[]
       btnSubmit.addEventListener("click",async()=>{
        const rankings = await fetch(`https://n8n.sortenabetferramentas.online/webhook/15af85e6-1781-get-user?email=${userEmail.value}`, {
                method: 'GET',
                headers: requestHeaders,

            })
                .then(response => {
                    if (response.ok) {
                        return response.json()
                    } else {
                        response.json().then(respError => {
                            alert(`${respError.message}`)
                        })
                    }
                })
array.push(rankings)

renderPlayer(false,array)
            return rankings       })
        }

        filterRanking()
    </script>

</body>

</html>
